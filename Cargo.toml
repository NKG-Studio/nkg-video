[package]
name = "nkg-video"
version = "0.1.0"
edition = "2021"
description = "A Rust-owned FFmpeg video player"
license = "GPL-3.0-or-later"

[dependencies]
egui_dock = "0.16"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rodio = { version = "0.20.1", default-features = false }
serde_json = "1"
bytemuck = "1"
windows = { version = "0.58", features = ["Win32_Graphics_Direct3D12"] }
wgpu = { version = "24.0.5", default-features = false, features = ["dx12", "wgsl"] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
cc = "1"
winresource = "0.1.31"

[dev-dependencies]
pollster = "0.4"
